[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "myhappybot"
version = "0.1.0"
description = "Personal finance MCP chatbot with a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.19,<2",
    "altair>=6,<7",
    "langchain>=1.3,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-openai>=1.4,<2",
    "korea-realestate-mcp==0.1.0",
    "mcp>=1.29,<2",
    "pydantic>=2.13,<3",
    "pandas>=3,<4",
    "python-dotenv>=1.2,<2",
    "SQLAlchemy>=2.0.52,<3",
    "streamlit>=1.61,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[project.scripts]
finance-mcp = "personal_finance.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
